openapi: 3.0.1

info:
  title: HOUSE RENTALS API
  description: |
    Information system to manage house rentals.
  version: 0.2.0

servers:
  - description: Local server for our House Rentals api tests.
    url: http://localhost:8000/

tags:
  - name: Users
    description: User creation and getting specific user.
  - name: Locations
    description: Location creation and management.
  - name: Houses
    description: House creation and management.
  - name: Bookings
    description: Bookings made by a user to a specific house.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: Token UUID generated at user creation.

paths:
  /users:
    post:
      tags:
        - Users
      summary: Create a new user.
      description: >
        Returns user identifier and token.
      requestBody:
        description: For user creation name and email must be provided.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "António Mendes"
                email:
                  type: string
                  example: "antoniomendes@example.com"
      responses:
        "200":
          description: User creation successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: integer
                    example: 1
                  token:
                    type: string
                    format: uuid
                    description: Authentication token to be sent in the Authorization header for all remaining POST methods.
                    example: 8fe814ec-434a-49d5-95c0-a66e1edf1c69

        "400":
          description: Bad request at user creation.
          content:
            application/json:
              example:
                uri: "/users"
                message: "User email already exists"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/users"
                message: "Internal error, contact the developers to report this situation."


  /users/{uid}:
    get:
      tags:
        - Users
      summary: Get the details of a user.
      description: >
        Returns user identifier, name and email.
      parameters:
        - in: path
          name: uid
          schema:
            type: integer
          required: true
          description: Numeric ID of the user to get
      responses:
        "200":
          description: Successful retrieval of user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Ana
                  email:
                    type: string
                    example: ana12345@gmail.com

        "400":
          description: Bad request retrieving user information.
          content:
            application/json:
              example:
                uri: "/users/a!sad"
                message: "Invalid identifier uid"

        "404":
          description: User not found.
          content:
            plain:
              example:
                uri: "/users/99999"
                message: "User does not exist"

        "500":
          description: Internal server error.
          content:
            plain:
              example:
                uri: "/users/1"
                message: "Internal error, contact the developers to report this situation."


  /users/{uid}/bookings:
    get:
      tags:
        - Users
      summary: Get the bookings of a user.
      description: >
        Returns the booking identifier, start date, end date, user identifier and house identifier for every booking.
      parameters:
        - in: path
          name: uid
          schema:
            type: integer
          required: true
          description: Numeric ID of the user
      responses:
        "200":
          description: Successful retrieval of user bookings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bid:
                    type: integer
                    example: 1
                  startDate:
                    type: string
                    example: 2025-12-07
                  endDate:
                    type: string
                    example: 2025-12-11
                  uid:
                    type: integer
                    example: 1
                  hid:
                    type: integer
                    example: 2

        "400":
          description: Bad request retrieving user bookings.
          content:
            application/json:
              example:
                uri: "/users/abc/bookings"
                message: "Invalid identifier uid"

        "404":
          description: User not found.
          content:
            application/json:
              example:
                uri: "/users/99999/bookings"
                message: "User does not exist"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/users/1/bookings"
                message: "Internal error, contact the developers to report this situation."


  /locations:
    get:
      tags:
        - Locations
      summary: Get the list of locations of a given type.
      description: >
        Returns all locations identifier name and type.
      parameters:
        - in: query
          name: type
          schema:
            type: string
          required: true
          description: Name of the location type
      responses:
        "200":
          description: Successful retrieval of children information.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    lid:
                      type: integer
                    name:
                      type: string
                    type:
                      type: string
              example:
                - lid: 4
                  name: "Paço de Arcos"
                  type: "LOCALITY"
                - lid: 5
                  name: "Algés"
                  type: "LOCALITY"
                - lid: 6
                  name: "Barcarena"
                  type: "LOCALITY"


        "400":
          description: Bad request retrieving location's of given type
          content:
            plain:
              example:
                uri: "/locations/"
                message: "Location type does not exist, valid types: COUNTRY, REGION, DISTRICT, MUNICIPALITY, LOCALITY"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/locations"
                message: "Internal error, contact the developers to report this situation."


    post:
      tags:
        - Locations
      summary: Create a new location.
      description: >
        Returns location identifier.
      security:
        - bearerAuth: [ ]
      requestBody:
        description: The user must specify the name, type and parent location of this location.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Lisboa"
                type:
                  type: string
                  example: "DISTRICT"
                parentId:
                  type: integer
                  example: 1
      responses:
        "200":
          description: Location creation successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lid:
                    type: integer
                    example: 1

        "400":
          description: Bad request at location creation.
          content:
            application/json:
              example:
                uri: "/locations"
                message: "Field [type] is required, but hasn't been passed."

        "401":
          description: Authentification needed for location creation.
          content:
            application/json:
              example:
                uri: "/locations"
                message: "Invalid auth token"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/locations"
                message: "Internal error, contact the developers to report this situation."


  /locations/{lid}:
    get:
      tags:
        - Locations
      summary: Get the details of a location.
      description: >
        Returns location's name and type.
      parameters:
        - in: path
          name: lid
          schema:
            type: integer
          required: true
          description: Numeric ID of the location
      responses:
        "200":
          description: Successful retrieval of location information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Portugal
                  type:
                    type: string
                    example: COUNTRY

        "400":
          description: Bad request retrieving location information.
          content:
            application/json:
              example:
                uri: "/locations/abc"
                message: "Invalid identifier lid"

        "404":
          description: Location not found.
          content:
            application/json:
              example:
                uri: "/locations/99999"
                message: "Location does not exist"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/locations/1"
                message: "Internal error, contact the developers to report this situation."


  /locations/{lid}/children:
    get:
      tags:
        - Locations
      summary: Get the list of child locations of a given location.
      description: >
        Returns all children locations name and type.
      parameters:
        - in: path
          name: lid
          schema:
            type: integer
          required: true
          description: Numeric ID of the location
      responses:
        "200":
          description: Successful retrieval of children information.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
              example:
                - name: "Paço de Arcos"
                  type: "LOCALITY"
                - name: "Algés"
                  type: "LOCALITY"
                - name: "Barcarena"
                  type: "LOCALITY"


        "400":
          description: Bad request retrieving location's children information.
          content:
            plain:
              example:
                uri: "/locations/abc/children"
                message: "Invalid identifier lid"

        "404":
          description: Location not found.
          content:
            application/json:
              example:
                uri: "/locations/99999/children"
                message: "Location does not exist"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/locations/1/children"
                message: "Internal error, contact the developers to report this situation."


  /locations/{lid}/full:
    get:
      tags:
        - Locations
      summary: Get the full hierarchical path of a location
      description: >
        Returns the name and type of every location in the hierarchy.
      parameters:
        - in: path
          name: lid
          schema:
            type: integer
          required: true
          description: Numeric ID of the location
      responses:
        "200":
          description: Successful retrieval of hierarchy information.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
              example:
                - name: "Portugal"
                  type: "COUNTRY"
                - name: "Lisboa"
                  type: "DISTRICT"
                - name: "Oeiras"
                  type: "MUNICIPALITY"
                - name: "Paço de Arcos"
                  type: "LOCALITY"


        "400":
          description: Bad request retrieving hierarchy information.
          content:
            application/json:
              example:
                uri: "/locations/abc/full"
                message: "Invalid identifier lid"

        "404":
          description: Location not found.
          content:
            application/json:
              example:
                uri: "/locations/99999/full"
                message: "Location does not exist"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/locations/5/full"
                message: "Internal error, contact the developers to report this situation."


  /houses:
    post:
      tags:
        - Houses
      summary: Create a new house.
      description: >
        Returns house identifier.
      security:
        - bearerAuth: [ ]
      requestBody:
        description: The user must specify all important information about this house - title, location, area, price and description.
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "T2 com vista para o rio"
                location:
                  type: integer
                  example: 5
                areaSqMt:
                  type: number
                  example: 80
                pricePerNight:
                  type: number
                  example: 141
                description:
                  type: string
                  example: "Apartamento T2 com vista para o rio. Com 2 quartos duplos, quarto de casal, casa de banho, cozinha e sala."
      responses:
        "200":
          description: House creation successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hid:
                    type: integer
                    example: 1

        "400":
          description: Bad request at house creation.
          content:
            application/json:
              example:
                uri: "/houses"
                message: "Field [pricePerNight] is required, but hasn't been passed"

        "401":
          description: Authentification needed for house creation.
          content:
            application/json:
              example:
                uri: "/houses"
                message: "Invalid auth token"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/houses"
                message: "Internal error, contact the developers to report this situation."

    get:
      tags:
        - Houses
      summary: Get a list with all houses.
      description: >
        Returns all houses identifier, title, location, area per square meter, price per night and description.
      parameters:
        - in: query
          name: location
          schema:
            type: integer
          required: false
          description: Location identifier used for filtering
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: String contained in the house title, used for searching
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          description: Limits the number of items returned from the server
        - in: query
          name: skip
          schema:
            type: integer
          required: false
          description: Specifies how many items are skipped for the return
      responses:
        "200":
          description: Successful retrieval of houses information.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    hid:
                      type: integer
                    title:
                      type: string
                    location:
                      type: integer
                    areaSqMt:
                      type: number
                    pricePerNight:
                      type: number
                    description:
                      type: string
                    owner:
                      type: integer
              example:
                - hid: 1
                  title: T2 com vista para o rio
                  location: 1
                  areaSqMt: 80.0
                  pricePerNight: 141.0
                  description: Apartamento T2 com vista para o rio. Com 2 quartos duplos, quarto de casal, casa de banho, cozinha e sala.
                  owner: 1
                - hid: 2
                  title: T3 Moradia independente
                  location: 4
                  areaSqMt: 88.0
                  pricePerNight: 300.0
                  description: T3 Moradia independente com 3 quartos, casa de banho, cozinha e zona de arrumos.
                  owner: 2

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/houses"
                message: "Internal error, contact the developers to report this situation."


  /houses/{hid}:
    get:
      tags:
        - Houses
      summary: Get the detailed information of a house.
      description: >
        Returns the identifier, title, location, area per square meter, price per night and description of the specified house.
      parameters:
        - in: path
          name: hid
          schema:
            type: integer
          required: true
          description: Numeric ID of the house
      responses:
        "200":
          description: Successful retrieval of house information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    example: T2 com vista para o rio
                  location:
                    type: integer
                    example: 1
                  areaSqMt:
                    type: number
                    example: 80.0
                  pricePerNight:
                    type: number
                    example: 141.0
                  description:
                    type: string
                    example: Apartemento T2 com vista para o rio. Com 2 quartos duplos, quarto de casal, casa de banho, cozinha e sala.
                  owner:
                    type: integer
                    example: 1



        "400":
          description: Bad request retrieving house information.
          content:
            application/json:
              example:
                uri: "/houses/abc"
                message: "Invalid identifier hid"

        "404":
          description: House not found.
          content:
            application/json:
              example:
                uri: "/houses/99999"
                message: "House does not exist"

        "500":
          description: Internal server error.
          content:
            plain:
              example:
                uri: "/houses/1"
                message: "Internal error, contact the developers to report this situation."

  /houses/{hid}/daysAvailable:
    get:
      tags:
        - Houses
      summary: Get the list of the available days to book an house in specific month.
      description: >
        Returns the identifier, title, location, area per square meter, price per night and description of the specified house.
      parameters:
        - in: path
          name: hid
          schema:
            type: integer
          required: true
          description: Numeric ID of the house
        - in: query
          name: month
          schema:
            type: integer
          required: true
          description: Month to check for available days
        - in: query
          name: year
          schema:
            type: integer
          required: true
          description: Year to check for available days
      responses:
        "200":
          description: Successful retrieval of available days.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                example: [1, 2, 3, 4, 5, 6, 12, 13, 14, 15]

        "400":
          description: Bad request retrieving house's available days.
          content:
            application/json:
              example:
                uri: "/houses/abc/daysAvailable"
                message: "Invalid identifier hid"

        "404":
          description: House not found.
          content:
            application/json:
              example:
                uri: "/houses/99999/daysAvailable"
                message: "House does not exist"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/houses/1/daysAvailable"
                message: "Internal error, contact the developers to report this situation."


  /houses/available:
    get:
      tags:
        - Houses
      summary: Get a list with the available houses for a given period.
      description: >
        Returns all houses title, location, area per square meter, price per night and description.
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
          required: true
          description: Start date to check for availability
        - in: query
          name: endDate
          schema:
           type: string
          required: true
          description: End date to check for availability
      responses:
        "200":
          description: Successful retrieval of houses information.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    hid:
                      type: integer
                    title:
                      type: string
                    location:
                      type: integer
                    areaSqMt:
                      type: number
                    pricePerNight:
                      type: number
                    description:
                      type: string
                    owner:
                      type: integer
              example:
                - hid: 1
                  title: T2 com vista para o rio
                  location: 1
                  areaSqMt: 80.0
                  pricePerNight: 141.0
                  description: Apartemento T2 com vista para o rio. Com 2 quartos duplos, quarto de casal, casa de banho, cozinha e sala.
                  owner: 1
                - hid: 2
                  title: T3 Moradia independente
                  location: 4
                  areaSqMt: 88.0
                  pricePerNight: 300.0
                  description: T3 Moradia independente com 3 quartos, casa de banho, cozinha e zona de arrumos.
                  owner: 2

        "400":
          description: Bad request retrieving houses available..
          content:
            application/json:
              example:
                uri: "/houses/available"
                message: "Did not find required query parameter endDate"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "houses/available"
                message: "Internal error, contact the developers to report this situation."


  /bookings:
    post:
      tags:
        - Bookings
      summary: Create a new booking.
      description: >
        Returns booking identifier.
      security:
        - bearerAuth: [ ]
      requestBody:
        description: The user must specify which house and date interval is associated to this booking.
        content:
          application/json:
            schema:
              type: object
              properties:
                hid:
                  type: integer
                  example: 1
                startDate:
                  type: string
                  example: "2026-05-05"
                endDate:
                  type: string
                  example: "2026-05-15"
      responses:
        "200":
          description: Booking creation successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bid:
                    type: integer
                    example: 1

        "400":
          description: Bad request at house creation.
          content:
            application/json:
              example:
                uri: "/bookings"
                message: "Field [hid] is required, but hasn't been passed"

        "401":
          description: Authentification needed for house creation.
          content:
            application/json:
              example:
                uri: "/bookings"
                message: "Invalid auth token"

        "404":
          description: House not found (when putting non existing hid).
          content:
            application/json:
              example:
                uri: "/bookings"
                message: "House does not exist"

        "409":
          description: Can't repeat the same exact booking.
          content:
            application/json:
              example:
                uri: "/bookings"
                message: "House is not available"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/bookings"
                message: "Internal error, contact the developers to report this situation."


    get:
      tags:
        - Bookings
      summary: Get a list with all bookings included in the date interval.
      description: >
        Returns the booking identifier, start date, end date, user identifier and house identifier for every booking in the interval.
      parameters:
        - in: query
          name: hid
          schema:
            type: integer
          required: true
          description: House identifier
        - in: query
          name: date-interval
          schema:
            type: string
          required: true
          description: Date interval of the bookings we want to retrieve, first date represents startDate and the second date represents endDate (yyyy-mm-dd)
      responses:
        "200":
          description: Successful retrieval of bookings information.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bid:
                      type: integer
                    startDate:
                      type: string
                    endDate:
                      type: string
                    uid:
                      type: integer
                    hid:
                      type: integer
              example:
                - bid: 1
                  startDate: 2025-12-01
                  endDate: 2025-12-03
                  uid: 1
                  hid: 1

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "/bookings"
                message: "Internal error, contact the developers to report this situation."



  /bookings/{bid}:
    get:
      tags:
        - Bookings
      summary: Get the detailed information of a booking.
      description: >
        Returns the start date, end date, user identifier and house identifier for a specific booking.
      parameters:
        - in: path
          name: bid
          schema:
            type: integer
          required: true
          description: Numeric ID of the booking
      responses:
        "200":
          description: Successful retrieval of booking information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bid:
                    type: integer
                    example: 1
                  startDate:
                    type: string
                    example: 2025-12-07
                  endDate:
                    type: string
                    example: 2025-12-11
                  uid:
                    type: integer
                    example: 1
                  hid:
                    type: integer
                    example: 2

        "400":
          description: Bad request retrieving booking information.
          content:
            application/json:
              example:
                uri: "/bookings/abc"
                message: "Invalid identifier bid"

        "404":
          description: Booking not found.
          content:
            application/json:
              example:
                uri: "/bookings/99999"
                message: "Booking does not exist"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "bookings/1"
                message: "Internal error, contact the developers to report this situation."

    delete:
      tags:
        - Bookings
      summary: Delete a specified booking.
      description: >
        Deletes a booking given identifier.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: bid
          schema:
            type: integer
          required: true
          description: Numeric ID of the booking
      responses:
        "204":
          description: Deleted booking successfully.

        "400":
          description: Bad request retrieving booking information.
          content:
            application/json:
              example:
                uri: "/bookings/abc"
                message: "Invalid identifier bid"

        "404":
          description: Booking not found.
          content:
            application/json:
              example:
                uri: "/bookings/99999"
                message: "Booking does not exist"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "bookings/1"
                message: "Internal error, contact the developers to report this situation."

    put:
      tags:
        - Bookings
      summary: Update the date interval of a booking.
      description: >
        Returns the start date, end date, user identifier and house identifier for a specific booking.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: bid
          schema:
            type: integer
          required: true
          description: Numeric ID of the booking
      requestBody:
        description: The user can only update the start date and end date of a booking.
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                  example: "2026-05-05"
                endDate:
                  type: string
                  example: "2026-05-15"
      responses:
        "200":
          description: Successful update of booking information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  startDate:
                    type: string
                    example: 2025-12-07
                  endDate:
                    type: string
                    example: 2025-12-11
                  uid:
                    type: integer
                    example: 1
                  hid:
                    type: integer
                    example: 2

        "400":
          description: Bad request retrieving booking information.
          content:
            application/json:
              example:
                uri: "/bookings/abc"
                message: "Invalid identifier bid"

        "404":
          description: Booking not found.
          content:
            application/json:
              example:
                uri: "/bookings/99999"
                message: "Booking does not exist"

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                uri: "bookings/1"
                message: "Internal error, contact the developers to report this situation."
